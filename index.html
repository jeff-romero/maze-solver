<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet" type="text/css" href="assets/styles/main.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <div id="top">
            <i id="settings-button" class="material-icons">&#xe8b8</i>
            <button id="solve" onclick="settings.solve()">SOLVE</button>
            <i id="invisible-settings-button" class="material-icons">&#xe8b8</i>
        </div>
        <div id="bottom">
            <div id="settings">
                <div class="category">
                    <div class="label-input-group">
                        <span class="settings-label">Rows</span>
                        <input id="rows" type="number" min="3" max="30">
                    </div>
                    <div class="errors">
                        <span id="rows-error" class="settings-input-invisible-error">.</span>
                        <span class="settings-input-invisible-error">.</span>
                        <span class="settings-input-invisible-error">.</span>
                        <span class="settings-input-invisible-error">.</span>
                    </div>
                </div>
                <div class="category">
                    <div class="label-input-group">
                        <span class="settings-label">Columns</span>
                        <input id="columns" type="number" min="3" max="30">
                    </div>
                    <div class="errors">
                        <span id="cols-error" class="settings-input-invisible-error">.</span>
                        <span class="settings-input-invisible-error">.</span>
                        <span class="settings-input-invisible-error">.</span>
                        <span class="settings-input-invisible-error">.</span>
                    </div>
                </div>
                <div class="category">
                    <div class="label-input-group">
                        <span class="settings-label">Source Coordinates</span>
                        <div>
                            <input id="source-r" type="number" placeholder="row" min="0" max="29">
                            <input id="source-c" type="number" placeholder="col" min="0" max="29">
                        </div>
                    </div>
                    <div class="errors">
                        <span id="source-r-error" class="settings-input-invisible-error">.</span>
                        <span id="source-c-error" class="settings-input-invisible-error">.</span>
                        <span id="source-wall-error" class="settings-input-invisible-error">.</span>
                        <span id="source-same-error" class="settings-input-invisible-error">.</span>
                    </div>
                </div>
                <div class="category">
                    <div class="label-input-group">
                        <span class="settings-label">Target Coordinates</span>
                        <div>
                            <input id="target-r" type="number" placeholder="row" min="0" max="29">
                            <input id="target-c" type="number" placeholder="col" min="0" max="29">
                        </div>
                    </div>
                    <div class="errors">
                        <span id="target-r-error" class="settings-input-invisible-error">.</span>
                        <span id="target-c-error" class="settings-input-invisible-error">.</span>
                        <span id="target-wall-error" class="settings-input-invisible-error">.</span>
                        <span id="target-same-error" class="settings-input-invisible-error">.</span>
                    </div>
                </div>
                <button id="draw-walls" onclick="">DRAW WALLS</button>
                <div id="close" class="close-button">&#x2715</div>
            </div>
            <div id="maze"></div>
        </div>
    </body>
    <script src="assets/scripts/script.js"></script>
</html>
